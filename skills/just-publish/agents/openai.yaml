interface:
  display_name: "Just Publish"
  short_description: "Publish the website you built with AI to a live public URL, straight from the chat, with no setup."
  icon_small: "./assets/icon.svg"
  icon_large: "./assets/icon-512.png"
  brand_color: "#01AE99"
  default_prompt: "Publish this website with Just Publish and give me the live link."

policy:
  allow_implicit_invocation: true

# One entry per MCP SERVER (the connector Codex installs and wires), not per
# tool: this endpoint exposes deploy, list_sites, get_site_files and
# update_site_file, behind a one-time OAuth sign-in the client runs itself.
#
# The url is the general endpoint an installer wires up. Claude uses its own
# connector address, https://mcp.justpublish.ai/claude, documented in SKILL.md;
# it is added inside Claude, not through this manifest. test/skill.test.ts in
# the server repo fails if this url changes.
dependencies:
  tools:
    - type: "mcp"
      value: "just-publish"
      description: "Just Publish MCP server: publish a static site to a live public URL, and read or edit its files."
      transport: "streamable_http"
      url: "https://mcp.justpublish.ai/"
